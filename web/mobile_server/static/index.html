<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tabela Ölçüm</title>
<style>
  :root {
    --bg:       #0a0e17;
    --surface:  #111827;
    --border:   #1e2d45;
    --accent:   #00d4ff;
    --accent2:  #00ff9d;
    --warn:     #ff6b35;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --card:     #0f1929;
    --font:     'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100%;
    overflow: hidden;
    user-select: none;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Viewfinder ── */
  #viewfinder {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0.7;
    z-index: 5;
  }
  .corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

  /* Status bar */
  #status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  #conn-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 0 var(--muted);
    transition: all 0.3s;
  }
  #conn-dot.connected {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 2s infinite;
  }
  #conn-dot.error { background: var(--warn); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 4px var(--accent2); }
    50% { box-shadow: 0 0 12px var(--accent2); }
  }

  #fps-badge {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Detection overlay label */
  #detection-overlay {
    position: absolute;
    bottom: 16px; left: 16px; right: 16px;
    z-index: 10;
    pointer-events: none;
  }

  #det-card {
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
  }

  #det-card.visible { display: block; }

  .det-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .det-label {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .det-dims {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .det-area {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 600;
  }

  .det-conf {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  /* ── Bottom panel ── */
  #bottom-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }

  /* Distance control */
  #dist-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
  }

  #dist-row label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #dist-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }
  #dist-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0,212,255,0.5);
  }

  #dist-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 42px;
    text-align: right;
  }

  /* Action buttons */
  #action-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.96); }

  #btn-save {
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    color: #000;
    flex: 2;
    font-size: 15px;
  }
  #btn-save:disabled {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  #btn-list {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  #btn-cam {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  /* Toast */
  #toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent2);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 50px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Kayıtlar Modal ── */
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    flex-direction: column;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #modal.open { display: flex; }

  #modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  #modal-close {
    width: 32px; height: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    padding: 0;
    font-family: var(--font);
  }

  #modal-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .record-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }

  .record-dims {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .record-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .record-meta span { display: flex; align-items: center; gap: 3px; }

  .record-area {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 600;
  }

  .record-delete {
    position: absolute;
    top: 12px; right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .record-gps {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
  }

  .no-records {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }

  /* Note input */
  #note-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #note-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
  }
  #note-input::placeholder { color: var(--muted); }
  #note-input:focus { border-color: rgba(0,212,255,0.4); }
</style>
</head>
<body>

<div id="app">

  <!-- ── Viewfinder ── -->
  <div id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-overlay"></canvas>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="status-bar">
      <div id="conn-indicator">
        <div id="conn-dot"></div>
        <span id="conn-text">Bağlanıyor…</span>
      </div>
      <div id="fps-badge">— ms</div>
    </div>

    <div id="detection-overlay">
      <div id="det-card">
        <div class="det-row">
          <span class="det-label" id="det-label-text">Tabela</span>
          <span class="det-conf" id="det-conf-text"></span>
        </div>
        <div class="det-row" style="margin-top:4px">
          <span class="det-dims" id="det-dims-text">— × —</span>
          <span class="det-area" id="det-area-text"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Bottom Panel ── -->
  <div id="bottom-panel">
    <div id="dist-row">
      <label>📏 Mesafe</label>
      <input type="range" id="dist-slider" min="1" max="30" step="0.5" value="5">
      <span id="dist-value">5 m</span>
    </div>

    <div id="note-row">
      <input type="text" id="note-input" placeholder="Not ekle (isteğe bağlı)…" maxlength="80">
    </div>

    <div id="action-row">
      <button class="btn" id="btn-cam" onclick="switchCamera()">🔄</button>
      <button class="btn" id="btn-save" disabled onclick="saveCurrentDetection()">
        💾 Kaydet
      </button>
      <button class="btn" id="btn-list" onclick="openModal()">📋</button>
    </div>
  </div>

</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<!-- ── Kayıtlar Modalı ── -->
<div id="modal">
  <div id="modal-header">
    <span id="modal-title">Kaydedilen Ölçümler</span>
    <button id="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div id="modal-list"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const WS_URL  = `ws${location.protocol === 'https:' ? 's' : ''}://${location.host}/ws/stream`;
const FRAME_INTERVAL_MS = 200;  // 5 fps → sunucu yükü az
const JPEG_QUALITY = 0.65;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let ws            = null;
let stream        = null;
let facingMode    = "environment";  // arka kamera
let sendTimer     = null;
let lastResult    = null;
let currentGPS    = null;

// ═══════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════
const video       = document.getElementById("video");
const canvas      = document.getElementById("canvas-overlay");
const ctx         = canvas.getContext("2d");
const connDot     = document.getElementById("conn-dot");
const connText    = document.getElementById("conn-text");
const fpsBadge    = document.getElementById("fps-badge");
const detCard     = document.getElementById("det-card");
const distSlider  = document.getElementById("dist-slider");
const distValue   = document.getElementById("dist-value");
const btnSave     = document.getElementById("btn-save");

// ═══════════════════════════════════════════════════════
//  GPS
// ═══════════════════════════════════════════════════════
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    pos => {
      currentGPS = {
        latitude:  pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy:  pos.coords.accuracy,
      };
    },
    err => console.warn("GPS:", err.message),
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}

// ═══════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    showToast("Kamera açılamadı: " + e.message, "error");
  }
}

function switchCamera() {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
}

// ═══════════════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════════════
function connectWS() {
  setConnState("connecting");
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setConnState("connected");
    startSending();
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "result")  handleResult(data);
    if (data.type === "saved")   showToast("✅ " + data.message);
    if (data.type === "ack")     showToast(data.message);
    if (data.type === "error")   showToast("⚠️ " + data.message, "error");
  };

  ws.onclose = () => {
    setConnState("disconnected");
    stopSending();
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => setConnState("error");
}

function setConnState(s) {
  connDot.className = s === "connected" ? "connected" : s === "error" ? "error" : "";
  const labels = {
    connecting: "Bağlanıyor…",
    connected: "Canlı",
    disconnected: "Bağlantı kesildi",
    error: "Hata"
  };
  connText.textContent = labels[s] || s;
}

// ═══════════════════════════════════════════════════════
//  FRAME GÖNDERME
// ═══════════════════════════════════════════════════════
const offCanvas  = document.createElement("canvas");
const offCtx     = offCanvas.getContext("2d");

function startSending() {
  stopSending();
  sendTimer = setInterval(sendFrame, FRAME_INTERVAL_MS);
}

function stopSending() {
  if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
}

function sendFrame() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (!video.videoWidth) return;

  // Frame'i küçük bir canvas'a çiz
  const W = 640, H = Math.round(640 * video.videoHeight / video.videoWidth);
  offCanvas.width = W; offCanvas.height = H;
  offCtx.drawImage(video, 0, 0, W, H);
  const b64 = offCanvas.toDataURL("image/jpeg", JPEG_QUALITY);

  ws.send(JSON.stringify({
    type: "frame",
    frame: b64,
    distance_m: parseFloat(distSlider.value),
  }));
}

// ═══════════════════════════════════════════════════════
//  SONUÇ İŞLEME
// ═══════════════════════════════════════════════════════
function handleResult(data) {
  fpsBadge.textContent = `${data.processing_ms} ms`;
  lastResult = data;
  resizeCanvas();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const scaleX = canvas.width  / (data.img_w || 640);
  const scaleY = canvas.height / (data.img_h || 360);

  const dets = data.detections || [];

  if (dets.length > 0) {
    const best = dets.reduce((a,b) => a.confidence > b.confidence ? a : b);

    dets.forEach((det, i) => {
      const [x1,y1,x2,y2] = det.bbox;
      const sx1 = x1*scaleX, sy1 = y1*scaleY;
      const sw   = (x2-x1)*scaleX, sh = (y2-y1)*scaleY;
      const isBest = det === best;

      // Bounding box
      ctx.strokeStyle  = isBest ? "#00d4ff" : "rgba(0,212,255,0.4)";
      ctx.lineWidth    = isBest ? 2.5 : 1.5;
      ctx.shadowColor  = "#00d4ff";
      ctx.shadowBlur   = isBest ? 10 : 4;
      ctx.strokeRect(sx1, sy1, sw, sh);
      ctx.shadowBlur = 0;

      // Köşe aksanları
      if (isBest) drawCorners(sx1, sy1, sw, sh, "#00d4ff");

      // Boyut etiketi
      if (isBest) {
        const label = `${det.width_m.toFixed(2)}m × ${det.height_m.toFixed(2)}m`;
        ctx.font = "bold 14px -apple-system, sans-serif";
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = "rgba(0,212,255,0.85)";
        ctx.fillRect(sx1, sy1 - 26, tw + 14, 22);
        ctx.fillStyle = "#000";
        ctx.fillText(label, sx1 + 7, sy1 - 9);
      }
    });

    // Alt bilgi kartı
    const d = best;
    document.getElementById("det-label-text").textContent =
      d.label + (data.mode === "mock" ? " [TEST]" : "");
    document.getElementById("det-conf-text").textContent =
      `%${Math.round(d.confidence * 100)} güven`;
    document.getElementById("det-dims-text").textContent =
      `${d.width_m.toFixed(2)} × ${d.height_m.toFixed(2)} m`;
    document.getElementById("det-area-text").textContent =
      `${d.area_m2.toFixed(2)} m²`;
    detCard.classList.add("visible");
    btnSave.disabled = false;

  } else {
    detCard.classList.remove("visible");
    btnSave.disabled = true;
  }
}

function drawCorners(x, y, w, h, color) {
  const len = 16, lw = 3;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.shadowBlur = 0;
  const corners = [
    [[x,y+len],[x,y],[x+len,y]],
    [[x+w-len,y],[x+w,y],[x+w,y+len]],
    [[x,y+h-len],[x,y+h],[x+len,y+h]],
    [[x+w-len,y+h],[x+w,y+h],[x+w,y+h-len]],
  ];
  corners.forEach(pts => {
    ctx.beginPath();
    ctx.moveTo(...pts[0]);
    ctx.lineTo(...pts[1]);
    ctx.lineTo(...pts[2]);
    ctx.stroke();
  });
}

function resizeCanvas() {
  const r = video.getBoundingClientRect();
  if (canvas.width !== r.width || canvas.height !== r.height) {
    canvas.width  = r.width;
    canvas.height = r.height;
  }
}

window.addEventListener("resize", resizeCanvas);

// ═══════════════════════════════════════════════════════
//  KAYDET
// ═══════════════════════════════════════════════════════
function saveCurrentDetection() {
  if (!lastResult || !lastResult.detections?.length) return;
  const best  = lastResult.detections.reduce((a,b) => a.confidence > b.confidence ? a : b);
  const note  = document.getElementById("note-input").value.trim();

  // Thumbnail al
  offCanvas.width = 160; offCanvas.height = 90;
  offCtx.drawImage(video, 0, 0, 160, 90);
  const thumb = offCanvas.toDataURL("image/jpeg", 0.5);

  ws.send(JSON.stringify({
    type:       "save",
    label:      best.label,
    width_m:    best.width_m,
    height_m:   best.height_m,
    distance_m: best.distance_m,
    confidence: best.confidence,
    latitude:   currentGPS?.latitude  ?? null,
    longitude:  currentGPS?.longitude ?? null,
    note,
    thumb_b64:  thumb,
  }));

  document.getElementById("note-input").value = "";
  btnSave.disabled = true;
  setTimeout(() => { btnSave.disabled = false; }, 1500);
}

// ═══════════════════════════════════════════════════════
//  MESAFE KAYDIRICI
// ═══════════════════════════════════════════════════════
distSlider.addEventListener("input", () => {
  const v = parseFloat(distSlider.value);
  distValue.textContent = `${v} m`;
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "set_distance", distance_m: v }));
  }
});

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, type = "ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = type === "error" ? "#ff6b35" : "#00ff9d";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

// ═══════════════════════════════════════════════════════
//  KAYITLAR MODALI
// ═══════════════════════════════════════════════════════
async function openModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("open");
  const list  = document.getElementById("modal-list");
  list.innerHTML = "<div class='no-records'>Yükleniyor…</div>";

  try {
    const res  = await fetch("/api/measurements");
    const rows = await res.json();

    if (!rows.length) {
      list.innerHTML = "<div class='no-records'>Henüz kayıt yok.</div>";
      return;
    }

    list.innerHTML = rows.map(r => `
      <div class="record-card" id="rc-${r.id}">
        <button class="record-delete" onclick="deleteRecord(${r.id})">✕</button>
        <div class="record-dims">${r.width_m.toFixed(2)} × ${r.height_m.toFixed(2)} m</div>
        <div class="record-area">${r.area_m2.toFixed(2)} m²</div>
        <div class="record-meta">
          <span>📅 ${new Date(r.saved_at).toLocaleString("tr-TR")}</span>
          ${r.distance_m ? `<span>📏 ${r.distance_m} m</span>` : ""}
          ${r.confidence ? `<span>🎯 %${Math.round(r.confidence*100)}</span>` : ""}
        </div>
        ${r.latitude ? `<div class="record-gps">📍 ${r.latitude.toFixed(6)}, ${r.longitude.toFixed(6)}</div>` : ""}
        ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">"${r.note}"</div>` : ""}
      </div>
    `).join("");

    document.getElementById("modal-title").textContent =
      `Kaydedilen Ölçümler (${rows.length})`;

  } catch(e) {
    list.innerHTML = "<div class='no-records'>Veriler alınamadı.</div>";
  }
}

async function deleteRecord(id) {
  await fetch(`/api/measurements/${id}`, { method: "DELETE" });
  document.getElementById(`rc-${id}`)?.remove();
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

(async () => {
  await startCamera();
  connectWS();
})();
